name: Python Face Registration & Recognition Test CI

# Runs on a self-hosted runner because of disk. The Triton image alone is about
# 31 GB unpacked, and a GitHub-hosted runner offers roughly 14 GB free, so this
# job cannot run there without a much smaller inference image.

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: self-hosted-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ruff
        # Pinned, so a new ruff release cannot fail an unchanged branch.
        run: pip install ruff==0.12.8

      - name: Check style and common errors
        # --no-fix on purpose. The repository sets fix = true for local work, but a
        # fixer must not run here: it deletes an import that a bug has made unused,
        # and so hides the bug it should report.
        run: ruff check . --no-fix

  test:
    runs-on: self-hosted-linux
    env:
      # One definition of the compose invocation, used by every step below.
      COMPOSE_ARGS: -f docker-compose.yaml -f docker-compose.ci.yaml -p face_reg_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report free disk
        run: df -h / | tail -1

      - name: Cache Docker Compose binary
        uses: actions/cache@v4
        with:
          path: ~/.docker/cli-plugins/docker-compose
          key: docker-compose-v2.39.3

      - name: Ensure Docker Compose available
        run: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          if ! command -v docker compose >/dev/null 2>&1; then
            if [ ! -f "$DOCKER_CONFIG/cli-plugins/docker-compose" ]; then
              echo "Installing Docker Compose..."
              curl -SL https://github.com/docker/compose/releases/download/v2.39.3/docker-compose-linux-x86_64 \
                -o $DOCKER_CONFIG/cli-plugins/docker-compose
              chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
            else
              echo "Using cached Docker Compose binary"
            fi
          else
            echo "Docker Compose already installed"
          fi

      # The weights are about 880 MB. A cache key must change when the set of models
      # changes, and must not change otherwise, because every distinct key writes
      # another 880 MB into the 10 GB repository cache quota.
      #
      # Hashing the whole download script would also react to an edited comment.
      # Hashing only the pinned checksums reacts to exactly the right thing: a
      # different file always has a different checksum, whatever its URL.
      - name: Fingerprint the model set
        id: models
        working-directory: face_reg_recog_milvus
        run: |
          fingerprint=$(grep -oE 'sha256="[a-f0-9]{64}"' scripts/download_models.py \
            | sort | sha256sum | cut -c1-16)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "model set fingerprint: $fingerprint"

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: face_reg_recog_milvus/app/triton_server/models
          key: model-cache-${{ steps.models.outputs.fingerprint }}
          # On a miss, start from the newest earlier cache. The next step then
          # fetches only the model that actually changed, not all of them.
          restore-keys: model-cache-

      - name: Download model weights
        working-directory: face_reg_recog_milvus
        # Runs on every build, cache hit or miss. The script checks each file against
        # its SHA256 and fetches only what is missing or wrong, so a good cache makes
        # this a no-op and a stale cache repairs itself.
        run: |
          python3 scripts/download_models.py
          # The script keeps the downloaded archives to make a later run cheap. CI
          # gets that from the cache instead, and the archives are another 970 MB.
          rm -rf app/.model_cache

      - name: Create .env file
        working-directory: face_reg_recog_milvus
        run: cp .env.example .env

      - name: Build Docker Compose services
        working-directory: face_reg_recog_milvus
        run: |
          docker compose $COMPOSE_ARGS build
          docker image prune -f

      - name: Start Docker Compose services
        working-directory: face_reg_recog_milvus
        run: |
          docker compose $COMPOSE_ARGS down -v --remove-orphans
          # --wait blocks until every started service reports healthy, and fails if
          # one does not. attu and mysql-admin are web consoles, so tests skip them.
          docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 300 \
            api triton etcd minio standalone mysql redis-server

      - name: Run PyTest
        working-directory: face_reg_recog_milvus
        run: docker compose $COMPOSE_ARGS run --rm pytest

      - name: Show service state on failure
        if: failure()
        working-directory: face_reg_recog_milvus
        run: |
          docker compose $COMPOSE_ARGS ps
          docker compose $COMPOSE_ARGS logs --tail 80 api triton
          df -h /

      - name: Stop services and reclaim disk
        if: always()
        working-directory: face_reg_recog_milvus
        run: |
          docker compose $COMPOSE_ARGS down -v --remove-orphans
          # Build cache grows without limit on a self-hosted runner. Keep one week,
          # which is enough to reuse layers between runs.
          docker builder prune -f --filter until=168h
          df -h / | tail -1
