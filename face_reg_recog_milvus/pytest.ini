[pytest]
# This file sits next to tests/ on purpose. The repository pyproject.toml is not
# mounted into the test container, so pytest configuration kept there is invisible
# when the suite runs in docker.

# `auto` means an `async def test_` needs no @pytest.mark.asyncio marker.
asyncio_mode = auto

# The app lifespan opens its clients once per session, so those clients are bound
# to one event loop. Fixtures AND tests must share that loop, or every await on a
# pooled connection raises "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests
