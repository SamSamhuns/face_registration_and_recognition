# The UI and the API share one origin.
#
# The camera needs a secure context, so the pages are served over HTTPS. A page on
# https:// may not call http://, because the browser blocks mixed content. Proxying
# the API under the same origin solves that, and removes CORS at the same time: the
# browser sees one origin, so it sends no preflight request.
#
# HTTPS only. There is no http-to-https redirect, because the container cannot know
# which host port Docker mapped to 443, and a redirect needs that number.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    root /usr/share/nginx/html;
    index enroll.html;

    # No URI part after the host, so nginx passes the original path through
    # unchanged. /api/v1/persons stays /api/v1/persons.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx allows 1 MB by default and would answer 413 before the request
        # reached the API. Keep this above MAX_UPLOAD_BYTES, which is 10 MB.
        client_max_body_size 12m;
    }

    location /health {
        proxy_pass http://api:8080;
    }
}
