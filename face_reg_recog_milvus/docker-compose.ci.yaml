# CI override. The base compose file already uses named volumes, so this only has to
# stop services from publishing host ports (shared runners collide on them).
services:
  api:
    ports: []
  triton:
    ports: []
  standalone:
    ports: []
  attu:
    ports: []
  mysql:
    ports: []
  mysql-admin:
    ports: []
  redis-server:
    ports: []
