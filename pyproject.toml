[project]
name = "face-reg-recog-milvus"
version = "0.1.0"
description = "Register faces and recognize saved faces with docker, milvus, redis, and mariaDB"
authors = [{ name = "SamSamhuns", email = "samhunsadamant@gmail.com" }]
license = { text = "Apache 2.0" }
readme = "README.md"
requires-python = ">=3.11,<=3.14"

dependencies = [
    "aiofiles==24.1.0",
    "fastapi (>=0.129.0,<0.130.0)",
    "httpx==0.28.1",
    "opencv-python-headless==4.12.0.88",
    "pillow (>=12.1.1,<13.0.0)",
    "pymilvus==2.6.17",
    "PyMySQL==1.1.1",
    "python-multipart (>=0.0.22,<0.0.23)",
    "redis==6.4.0",
    "requests==2.32.5",
    "tritonclient[grpc] (>=2.65.0,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "gdown (>=5.2.0,<6.0.0)",
    "urllib3 (>=2.6.3,<3.0.0)",
    "fonttools (>=4.61.1,<5.0.0)",
    "filelock (>=3.24.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
coverage = "^7.10.5"
httpx = "^0.28.1"
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
pytest-cov = "^6.2.1"
pytest-order = "^1.3.0"
pytest-testmon = "^2.1.3"
pytest-timeout = "^2.4.0"
requirements-parser = "^0.13.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.8"

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "F",   # pyflakes (undefined names, unused imports)
    "E",   # pycodestyle (errors)
    "W",   # pycodestyle (warnings)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # bugbear (common bugs)
    "C4",  # comprehensions (inefficient comprehensions)
    "SIM", # simplify (simplifiable conditions)
    "A",   # builtins (no shadowing)
    "T20", # no print statements
    "N",   # naming conventions
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are *designed* to be evaluated in argument
# defaults, so B008 is a false positive for them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# stdout IS the interface for a CLI script, and pytest captures prints deliberately
"**/scripts/*.py" = ["T201"]
"**/tests/*.py" = ["T201"]
"**/tests/**/*.py" = ["T201"]
# Standalone research scripts, not part of the served app. `HE` (homomorphic
# encryption context) and `X` (feature matrix) are the conventional spellings in
# their respective fields; renaming them would make the code harder to follow.
"**/scripts/homomorphic_emb_face_search_knn.py" = ["T201", "N803", "N806"]
"**/scripts/train_spoofed_face_vector_clsf.py" = ["T201", "N803", "N812"]
